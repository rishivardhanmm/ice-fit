<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ice Fit Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #11131f;
        background: #f6f7f8;
      }
      main {
        width: min(86vw, 360px);
        padding: 24px;
        border: 1px solid #d9dde2;
        border-radius: 8px;
        background: #fffefb;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #6b7280;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ice Fit is offline</h1>
      <p>Reconnect to the laptop running the local server and refresh.</p>
    </main>
  </body>
</html>
